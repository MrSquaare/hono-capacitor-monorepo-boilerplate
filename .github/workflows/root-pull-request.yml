name: "Root Pull Request"

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "apps/**"
      - "packages/**"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    name: Checks

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Check
        run: pnpm root:check
