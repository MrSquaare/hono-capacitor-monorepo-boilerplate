name: "@projectname/app Test"

on:
  push:
    branches:
      - main
    paths:
      - "apps/app/**"
      - "packages/shared/**"
      - "packages/shared-config/**"
      - "pnpm-lock.yaml"
      - ".github/actions/setup-env/**"
      - ".github/workflows/app-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/app/**"
      - "packages/shared/**"
      - "packages/shared-config/**"
      - "pnpm-lock.yaml"
      - ".github/actions/setup-env/**"
      - ".github/workflows/app-test.yml"

permissions:
  contents: read
  code-quality: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install Playwright Browsers
        run: pnpm --filter @projectname/app exec playwright install --with-deps

      - name: Test
        run: pnpm --filter @projectname/app test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/app/playwright-report/
          retention-days: 7

      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: apps/app/coverage/cobertura-coverage.xml
          language: JavaScript
          label: code-coverage/app
